name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El generador saca el <lastmod> del sitemap de la fecha del último
          # commit que tocó cada fichero de contenido. Necesitamos el historial
          # completo para no convertir cada deploy en una falsa actualización.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      # Regenera HTML estático, sitemap, llms y la capa de prerender SEO antes
      # de compilar. Así Google/Bing/Brave reciben contenido útil incluso sin JS.
      - run: npm run gen:pages
      - run: npm run build
      # El propio sitio de Archic es benchmark #1: identidad, rutas white-label,
      # metadatos y presupuesto de bundle deben pasar antes de publicar.
      - run: npm run quality:gate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow se envía DESPUÉS de publicar, para que la clave y las URLs ya
      # estén disponibles en archic.es cuando Bing/participantes las validen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Notify Bing and IndexNow search engines
        run: bun run scripts/submit-indexnow.ts
