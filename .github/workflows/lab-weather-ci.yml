name: Archic Lab — Weather checks

on:
  pull_request:
    paths:
      - 'src/lab/**'
      - 'src/styles/weather-decisions.css'
      - 'tests/lab-*.test.mjs'
      - 'src/pages/Lab*'
      - 'src/styles/archic-lab.css'
      - 'api/lab/**'
      - 'scripts/generate-lab-pages.ts'
      - 'tests/lab-weather.test.mjs'
      - 'src/App.tsx'
      - 'src/components/StudioHeader.tsx'
      - 'src/components/StudioFooter.tsx'
      - 'src/i18n/LanguageContext.tsx'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/lab-weather-ci.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lab/**'
      - 'src/pages/Lab*'
      - 'src/styles/archic-lab.css'
      - 'tests/lab-*.test.mjs'
      - 'scripts/audit-accessibility.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/lab-weather-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Weather contract tests
        run: bun run test:weather
      - name: Build production web
        run: bun run build
      - name: Existing production quality gate
        run: bun run quality:gate
      - name: Check Lab entrypoints
        run: |
          test -s dist/lab/index.html
          test -s dist/en/lab/index.html
          test -s dist/lab/weather/index.html
          test -s dist/en/lab/weather/index.html
