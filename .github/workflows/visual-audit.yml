name: Archic Visual Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
      - 'scripts/visual-audit.mjs'
      - 'src/**'
      - 'public/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: archic-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Desktop + iPhone visual audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate SEO and build production bundle
        run: |
          npm run gen:pages
          npm run build

      - name: Install Playwright for the audit only
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/archic-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/archic-preview.log
          exit 1

      - name: Capture full visual audit
        id: visual_audit
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
          AUDIT_OUTPUT: visual-audit
        run: node scripts/visual-audit.mjs

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archic-visual-audit
          path: visual-audit
          retention-days: 7
          if-no-files-found: error

      - name: Enforce visual audit result
        if: always()
        run: |
          if [ "${{ steps.visual_audit.outcome }}" != "success" ]; then
            echo "Visual audit failed. Diagnostics were uploaded above."
            exit 1
          fi
