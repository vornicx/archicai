name: Archic Identity Source Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/identity-source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'finalize one-time Archic identity source cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Remove legacy identity references from runtime source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.html', '.json', '.md', '.txt'}
          replacements = [
              ('?v=3', '?v=20260812'),
              ('https://archic.es/archic-mark-512.png', 'https://archic.es/brand/archic-symbol-2026.svg'),
              ('/archic-mark-512.png', '/brand/archic-symbol-2026.svg'),
              ('https://archic.es/og-image.jpg', 'https://archic.es/og-image.png?v=20260812'),
          ]

          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'updated {path}')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Regenerate crawler-facing pages
        run: npm run gen:pages
      - name: Build
        run: npm run build
      - name: Assert no legacy identity token remains in runtime output
        run: |
          if grep -RInE '\?v=3([^0-9]|$)|archic-mark-512\.png|og-image\.jpg|site\.webmanifest' dist --include='*.html' --include='*.js' --include='*.json' --include='*.txt'; then
            echo 'Legacy identity reference found in dist'
            exit 1
          fi
          if ! grep -RIl 'archic-symbol-2026.svg' dist >/dev/null; then
            echo 'Canonical Archic symbol missing from dist'
            exit 1
          fi
      - name: Assert crawler-facing documents contain no legacy identity token
        run: |
          if grep -RInE '\?v=3([^0-9]|$)|archic-mark-512\.png|og-image\.jpg|site\.webmanifest' . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=scripts \
            --include='*.html' --include='*.txt'; then
            echo 'Legacy identity reference found in crawler-facing source'
            exit 1
          fi
      - name: Commit clean identity sources
        run: |
          git config user.name 'vornicx'
          git config user.email 'vornicx@gmail.com'
          git rm .github/workflows/identity-source-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'purge legacy Archic identity references'
          git push
