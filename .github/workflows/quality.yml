name: Archic Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: archic-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archic Quality Standard 2026.1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate static pages and SEO
        run: bun run gen:pages

      - name: TypeScript + production build
        run: bun run build

      - name: Archic Quality Gate
        run: bun run quality:gate
